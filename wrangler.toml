# Cloudflare Wrangler configuration for Pixlized Website
# Run: pnpm add @astrojs/cloudflare && pnpm add wrangler -D

name = "pixlized-website"
main = "./dist/server/entry.mjs"
compatibility_date = "2024-01-01"

# Production configuration
[env.production]
name = "pixlized-website"
routes = ["https://pixlized.dev/*"]

# Development configuration
[env.development]
name = "pixlized-website-dev"

# Variables (set these in Cloudflare dashboard or use wrangler secret)
# ADMIN_SEED = "your-secret-key"
# ADMIN_USER = "your-username"
# ADMIN_PASS = "your-password"
# FORMSPREE_ENDPOINT = "your-formspree-endpoint"

# KV Namespace for database (optional - for persistent storage)
# [[kv_namespaces]]
# binding = "DB"
# id = "your-kv-namespace-id"

# R2 Bucket for assets (optional)
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "pixlized-assets"

# Cache configuration
[cache]
# Cache static assets aggressively
[cache.assets]
pattern = "/(assets|images|fonts|_astro)/.*"
cache_control = "public, max-age=31536000, immutable"

# Cache API responses for 1 hour
[cache.api]
pattern = "/api/.*"
cache_control = "public, max-age=3600"

# Don't cache HTML pages (they might have dynamic content)
[cache.html]
pattern = "\\.html$"
cache_control = "no-cache"

# Site configuration
[site]
bucket = "./public"
entry-point = "dist/server"
