name = "pixlized-website"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat", "navigator_als"]

# Main entry point generated by Astro build
main = "./dist/_worker.js"

# Static assets directory
[assets]
directory = "./dist"

# D1 Database binding
[[d1_databases]]
binding = "CF_D1_DB"
database_name = "pixlized-db"
database_id = "ca758b75-74e3-4f20-b799-f8d6ecf62a57"

# Production environment configuration
[env.production]
name = "pixlized-website"
main = "./dist/_worker.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = "./dist"

[[env.production.d1_databases]]
binding = "CF_D1_DB"
database_name = "pixlized-db"
database_id = "ca758b75-74e3-4f20-b799-f8d6ecf62a57"

# Development environment configuration
[env.development]
name = "pixlized-website-dev"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]
